<div
  class="min-h-screen flex flex-col lg:flex-row bg-[#F8F4F0] dark:bg-gray-900 font-sans text-gray-900 dark:text-gray-100 pb-16 lg:pb-0 transition-all duration-300 ease-in-out"
  [ngClass]="showSidebar ? (isSidebarMinimized ? 'lg:ps-[88px]' : 'lg:ps-[300px]') : ''"
>
  @if (showSidebar) {
    <header
      class="lg:hidden flex justify-between items-center px-4 py-3 bg-[#201f24] dark:bg-gray-950 text-white sticky top-0 z-40 shadow-md w-full"
    >
      <img
        src="assets/images/logo-large.svg"
        [alt]="'Finance Logo' | translate"
        class="h-6 max-w-[120px] object-contain"
      />

      <div class="flex items-center gap-4">
        <button
          (click)="settings.toggleTheme()"
          class="text-gray-400 hover:text-white transition-colors p-2"
        >
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button
          (click)="settings.toggleLanguage()"
          class="text-gray-400 hover:text-white transition-colors p-2"
        >
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path
              d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            ></path>
          </svg>
        </button>
      </div>
    </header>

    <app-sidebar (toggle)="isSidebarMinimized = $event"></app-sidebar>
  }

  <main
    class="flex-1 w-full mx-auto transition-all duration-300 min-w-0"
    [ngClass]="showSidebar ? 'max-w-7xl p-4 md:p-10' : 'p-0'"
  >
    <router-outlet></router-outlet>
  </main>
</div>
